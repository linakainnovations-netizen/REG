<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard | St. Charles Lwanga Regiment (Demo)</title>
<link rel="icon" type="image/png" href="assets/logo.png">
<link rel="apple-touch-icon" href="assets/icon-180.png">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0f172a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Lwanga Portal">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<!-- SAME CSS as the PHP build -->
<link rel="stylesheet" href="assets/css/style.css">
<link rel="stylesheet" href="dashboard/admin_priest/assets/main/dashboard-base.css">
<link rel="stylesheet" href="dashboard/admin_priest/assets/main/head-side.css">
<link rel="stylesheet" href="dashboard/admin_priest/assets/main/main.css">
<link rel="stylesheet" href="dashboard/admin_priest/assets/pages_styles/overview.css">
<link rel="stylesheet" href="dashboard/admin_priest/assets/pages_styles/users.css">
<link rel="stylesheet" href="dashboard/admin_priest/assets/pages_styles/groups.css">
<link rel="stylesheet" href="dashboard/admin_priest/assets/pages_styles/finance.css">
<link rel="stylesheet" href="dashboard/admin_priest/assets/pages_styles/announcements.css">
<link rel="stylesheet" href="dashboard/admin_priest/assets/pages_styles/handover.css">
<style>
.demo-strip{background:#f59e0b;color:#0f172a;font-weight:700;font-size:.8rem;padding:.45rem 1rem;text-align:center}
.dashboard-wrapper{display:flex;min-height:calc(100vh - 40px)}
.dashboard-main{flex:1;padding:1.5rem;min-width:0;background:#f8fafc}
.sidebar-switch{background:#0f172a;color:#cbd5e1;border-radius:.6rem;padding:.7rem;margin:.4rem 0;font-size:.8rem}
.sidebar-switch select{width:100%;margin-top:.4rem;padding:.45rem;border-radius:.4rem}
@media(max-width:900px){.dashboard-sidebar-premium{display:none}.dashboard-sidebar-premium.open{display:flex;position:fixed;z-index:99;height:100vh}}
/* ---- Mobile patch: all roles, all phones (complements real head-side.css/main.css) ---- */
@media(max-width:1024px){
.dashboard-sidebar-premium.open{transform:translateX(0)!important;z-index:10002;box-shadow:20px 0 60px rgba(0,0,0,.35);width:280px;max-width:85vw;height:100dvh;overflow-y:auto;display:flex!important;flex-direction:column!important}
.dashboard-sidebar-premium.open .sidebar-nav{display:block!important}
.dashboard-sidebar-premium.open .nav-item{display:flex!important;width:100%}
.dashboard-main{width:100%}
}
@media(max-width:768px){
form.grid{grid-template-columns:1fr!important}
.stats-grid,.charts-container{grid-template-columns:1fr!important}
.table-responsive{overflow-x:auto;-webkit-overflow-scrolling:touch}
.table-responsive table{min-width:640px}
.content-inner .card{border-radius:.8rem}
#dashHeader .header-search{display:none}
.overview-card .btn,.finance-container .btn-group{display:flex;flex-wrap:wrap;gap:.5rem}
.overview-card .btn a,.finance-container .btn-group .btn{flex:1 1 auto;text-align:center}
h1{font-size:1.4rem!important}
}
/* ---- Form controls (announcements / events / live-updates create forms) ---- */
.dashboard-main .form-control{width:100%;padding:.8rem 1rem;border:1px solid #cbd5e1;border-radius:.55rem;font-size:.95rem;font-family:inherit;background:#fff;color:#1e293b;transition:border-color .15s,box-shadow .15s;box-sizing:border-box}
.dashboard-main .form-control:focus{outline:none;border-color:#3b82f6;box-shadow:0 0 0 3px rgba(59,130,246,.18)}
.dashboard-main textarea.form-control{min-height:90px;resize:vertical}
.dashboard-main select.form-control{appearance:auto;cursor:pointer}
.dashboard-main .btn{display:inline-flex;align-items:center;justify-content:center;gap:.5rem;padding:.8rem 1.4rem;border-radius:.55rem;font-weight:700;font-size:.95rem;cursor:pointer;border:1px solid transparent;text-decoration:none}
.dashboard-main .btn-primary{background:#1e3a8a;color:#fff}
.dashboard-main .btn-primary:hover{background:#172f6e}
.dashboard-main .btn-outline{background:#fff;border-color:#cbd5e1;color:#334155}
.dashboard-main .btn-outline:hover{background:#f1f5f9}
.dashboard-main .btn-success{background:#059669;color:#fff;border:none}
.dashboard-main .btn-sm{padding:.45rem .7rem;font-size:.8rem;border-radius:.45rem}
.dashboard-main .btn-light{background:#f1f5f9;color:#475569;border:none}
.dashboard-main .text-danger{color:#dc2626!important}
/* ---- Official document modal (receipts / quotations — print on web, no files saved) ---- */
#docModal{position:fixed;inset:0;z-index:10006;display:flex;align-items:flex-start;justify-content:center;overflow-y:auto;padding:2rem 1rem}
#docModal .doc-backdrop{position:fixed;inset:0;background:rgba(15,23,42,.6)}
#docModal .doc-paper{position:relative;background:#fff;border-radius:.8rem;max-width:720px;width:100%;padding:2.2rem;box-shadow:0 30px 80px rgba(0,0,0,.4);font-family:Georgia,serif;color:#1e293b}
#docModal .doc-actions{display:flex;gap:.6rem;justify-content:flex-end;margin-bottom:1rem;font-family:Inter,sans-serif}
@media print{
body>*{display:none!important}
#docModal{display:block!important;position:static!important;padding:0!important}
#docModal .doc-backdrop,#docModal .doc-actions{display:none!important}
#docModal .doc-paper{box-shadow:none!important;max-width:100%!important;border-radius:0!important}
}
</style>
</head>
<body class="dashboard-body">
<div class="demo-strip">STATIC DEMO — same pages as PHP build · password REGIMENT · data saves in this browser only · <a href="index.html" style="text-decoration:underline">all accounts</a> · <a href="#" id="logoutTop" style="text-decoration:underline">log out</a></div>
<div id="sbBackdrop" style="display:none;position:fixed;inset:0;background:rgba(15,23,42,.6);z-index:10001;"></div>
<div class="dashboard-wrapper">
<aside class="dashboard-sidebar-premium" id="sidebar"></aside>
<main class="dashboard-main">
<header class="dashboard-header-premium" id="dashHeader" style="margin-bottom:1.2rem"></header>
<div class="content-inner" id="pageRoot"><p>Loading…</p></div>
</main>
</div>
<script src="js/demo-data.js"></script>
<script src="js/app.js"></script>
</body>
</html>
